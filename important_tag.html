<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title> Important Tag Prioritys</title>
        <style>
            #mypara{
                color: green;
            }
            .para{
                color: blue;
            }
            p{
                color: red !important;
            }
        </style>
    </head>
    <body>
        <p class="para" id="mypara">Hello World!</p>
    </body>
</html>
