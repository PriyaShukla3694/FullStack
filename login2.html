<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body{
                height: 100vh;
                font-family: Arial, sans-serif;
                background-color: #eef2f5;
            }

            .navbar{
                height: 65px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 35px;
                background-color: #222831;
                color: white;
            }

            .nav-links{
                display: flex;
                list-style: none;
                gap: 25px;
            }

            .nav-links a{
                color: white;
                text-decoration: none;
                font-size: 15px;
            }

            .nav-links a:hover{
                color: #00adb5;
            }

            .login-wrapper{
                min-height: calc(100vh - 65px);
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #eef2f5;
            }

            .login-container{
                width: 330px;
                padding: 30px;
                background-color: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .login-container h2{
                text-align: center;
                margin-bottom: 20px;
                color: #222831;
            }

            .login-container form{
                display: flex;
                flex-direction: column;
            }

            .login-container input{
                padding: 10px;
                margin-bottom: 15px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            .login-container button{
                padding: 10px;
                background-color: #405354;
                color: rgb(252, 251, 252);
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                 Login Page
            </div>
            <ul class="nav-links">
                <li>
                    <a href="#">Home</a>
                </li>
                <li>
                    <a href="#">About</a>
                </li>
                <li>
                    <a href="#">Services</a>
                </li>
                <li>
                    <a href="#">Contact</a>
                </li>
            </ul>
        </nav>
        <div class="login-wrapper">
            <div class="login-container">
                <h2>Login</h2>
                <form>
                    <div>
                        <input type="text" placeholder="Username" required>
                    </div>
                    <div>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            
                <div>
                    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
                </div>
            </div>
    </body>
</html>
