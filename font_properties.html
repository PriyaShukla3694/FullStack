<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower</title>
    <style>
       p{
            font-family: Arial, serif;
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            letter-spacing: 0.5px;
            word-spacing: 1px;
            font-style: italic;
            text-decoration: underline;
            text-transform: capitalize;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
       }
    </style>
</head>
<body>
    <p>This is a simple paragraph demonstrating font properties in HTML.</p>
</body>
</html>
