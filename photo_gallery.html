<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }
        h1 {
            text-align: center;
        }
        .gallery-container {
            width: 80%;
            margin: 30px auto;
            padding: 20px;

            background-color: white;
            border: 2px solid #333;
            border-radius: 10px;
        }
        .gallery {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;
        }
        .gallery img {
            width: 100%;
            height: 200px;

            object-fit: cover;

            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>

    <div class="gallery-container">

        <div class="gallery">

            <h5>Photo 1</h5>
            <h5>Photo 2</h5>
            <h5>Photo 3</h5>

            <h5>Photo 4</h5>
            <h5>Photo 5</h5>
            <h5>Photo 6</h5>

            <h5>Photo 7</h5>
            <h5>Photo 8</h5>
            <h5>Photo 9</h5>
        </div>
    </div>
</body>
</html>
