<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            outline: 1px solid black;
            width: 300px;
            padding: 3%;
            box-shadow: 3px 5px 5px gray;
            margin:auto;

        }
        .card_text{
            font-family:Arial;
            font-weight:900;
        }
        .card_button__submit{
            background-color: blue;
            color: white;
            box-shadow:inset 3px 5px 5px gray;
            width: 100px;
            height: 50px;
        }
        .card__image{
            width: 100%;
            height: 200px;
            object-fit: contain;
           
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://fastly.picsum.photos/id/49/200/300.jpg?blur=5&hmac=KJZD2QmlzaBbEc1a6TgCeD4No4Mk6ibe-4TahjWsfX8"class="card__image" alt="random image">
        <p class="card__text">Lorem Ipsum</p>
        <button class="card__button__submit">Submit</button>

    </div>
    
</body>
</html>
