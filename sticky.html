<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Gallery</title>

<style>

.container {
    width: 100vw;
    border: 1px solid black;
}

.box {
    width: 100vw;
    height: 600px;
    position: sticky;
    top: 0;
    overflow: hidden;
}

.box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.caption {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 42px;
    font-weight: bold;
    text-align: center;
    text-shadow: 2px 2px 8px black;
    font-family: Arial, sans-serif;
}

</style>
</head>

<body>

<div class="container">

    <div class="box" id="box1">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Into the Wild 🌿</div>
    </div>

    <div class="box" id="box2">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Mountain Escape 🏔️</div>
    </div>

    <div class="box" id="box3">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Where Mountains Meet the Sky ☁️</div>
    </div>

    <div class="box" id="box4">
        <img src="https://images.unsplash.com/photo-1473445361085-b9a07f55608b?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Deep Forest 🌲</div>
    </div>

    <div class="box" id="box5">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Into the Green 🌳</div>
    </div>

    <div class="box" id="box6">
        <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Chasing Waterfalls 💧</div>
    </div>

    <div class="box" id="box7">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Ocean Breeze 🌊</div>
    </div>

    <div class="box" id="box8">
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Golden Hour 🌅</div>
    </div>

    <div class="box" id="box9">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80">
        <div class="caption">Peace in Nature 🍃</div>
    </div>

</div>

</body>
</html>
