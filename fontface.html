<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Face</title>
    <style>
        @font-face {
            font-family: Inflate PTX font;
            src: url('InflatePTX.ttf') format('truetype');
        }

        body {
            font-family: 'Inflate PTX font', Arial, serif;
            font-style: bold;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Font Face Example</h1>
    <p>This paragraph is using the custom font defined in the @font-face rule.</p>
</body>
</html>
