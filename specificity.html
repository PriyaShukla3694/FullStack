<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer base, special;
        @layer base {
            p{
                font-size: 20px;
                color: red;
            }
        }
        @layer special{
            body{
                background-color: lightblue;
            }
            p{
        color: blue;
    }

        }
        button{
            font-size: 20px;
            color: red;
            border-radius:50%;
            width: 150px;
            height: 150px;
            background-color: blue;
            border:1px solid black;
            box-shadow: 3px 5px 5px gray;
        }
        button:active{
            box-shadow:inset 3px 5px 5px gray;
        }
   
    
    </style>
</head>
<body>
    <p>Specificity</p>
    <button>Click Me</button>
</body>
</html>
