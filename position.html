<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            background-color: black;
            
        }
        body{
            background-color: white;
            margin : 0px;
            padding: 20px;
            text-align: center;
            border: 5px solid black;

            
        }
        .container{
            width: 100%;
            height: 100vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
        }
        .box1{
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
            top: 0px;
            left: 0px;

        }
        .box2{
            width: 200px;
            height: 200px;
            background-color: blue;
            position: relative;
            top: 50px;

        }
        .box3{
            width: 200px;
            height: 200px;
            background-color: green;
            position: fixed;

        }
        .box4{
            width: 200px;
            height: 200px;
            background-color: yellow;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class = "box1"> Box 1</div>
        <div class = "box2"> Box 2</div>  
        <div class = "box3"> Box 3</div>
        <div class = "box4"> Box 4</div>
    </div>
            
        </body>
</html>
